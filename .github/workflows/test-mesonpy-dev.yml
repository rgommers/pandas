name: Test meson-python main

on:
  push:
    branches:
      - ci-mesonpython
  schedule:
  #          ┌───────────── minute (0 - 59)
  #          │  ┌───────────── hour (0 - 23)
  #          │  │ ┌───────────── day of the month (1 - 31)
  #          │  │ │ ┌───────────── month (1 - 12 or JAN-DEC)
  #          │  │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
  #          │  │ │ │ │
    - cron: "9  9 * * 6"

permissions:
  contents: read

defaults:
  run:
    shell: bash -el {0}

jobs:
  ubuntu:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        env_file: [actions-311.yaml]
    name: meson-python from git branch
    env:
      PATTERN: ${{ matrix.pattern }}
      EXTRA_APT: ''
      LANG: 'C.UTF-8'
      LC_ALL: ''
      PANDAS_COPY_ON_WRITE: '0'
      PANDAS_CI: '1'
      TEST_ARGS: ''
      PYTEST_WORKERS: 'auto'
      PYTEST_TARGET: 'pandas'
    concurrency:
      # https://github.community/t/concurrecy-not-work-for-push/183068/7
      group: ${{ github.event_name == 'push' && github.run_number || github.ref }}-${{ matrix.env_file }}-${{ matrix.pattern }}-${{ matrix.extra_apt || '' }}
      cancel-in-progress: true

    services:
      mysql:
        image: mysql:8.0.33
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: pandas
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 3306:3306

      postgres:
        image: postgres:13
        env:
          PGUSER: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pandas
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      moto:
        image: motoserver/moto:4.1.13
        env:
          AWS_ACCESS_KEY_ID: foobar_key
          AWS_SECRET_ACCESS_KEY: foobar_secret
        ports:
          - 5000:5000

    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Extra installs
      # xsel for clipboard tests
      run: sudo apt-get update && sudo apt-get install -y xsel ${{ env.EXTRA_APT }}

    - name: Generate extra locales
      # These extra locales will be available for locale.setlocale() calls in tests
      run: sudo locale-gen ${{ matrix.extra_loc }}
      if: ${{ matrix.extra_loc }}

    - name: Set up Conda
      uses: ./.github/actions/setup-conda
      with:
        environment-file: ci/deps/${{ matrix.env_file }}

#   - name: Install meson-python dev version
#     run: |
#       # python -m pip install git+https://github.com/mesonbuild/meson-python.git@main
#       python -m pip install git+https://github.com/mesonbuild/meson-python.git@refs/pull/467/head

    - name: Build Pandas
      id: build
      uses: ./.github/actions/build_pandas
#     with:
#       editable: false

    - name: Test (single_cpu)
      uses: ./.github/actions/run-tests
      env:
        PATTERN: 'single_cpu'
        PYTEST_WORKERS: 0
      if: ${{ matrix.pattern == '' && (always() && steps.build.outcome == 'success')}}

